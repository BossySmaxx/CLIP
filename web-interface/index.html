<!-- public/index.html -->
<!DOCTYPE html>
<html>
	<head>
		<title>SSE Demo</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				max-width: 600px;
				margin: 0 auto;
				padding: 20px;
			}
			#events {
				border: 1px solid #ccc;
				padding: 10px;
				height: 300px;
				overflow-y: scroll;
				margin-top: 20px;
			}
		</style>
	</head>
	<body>
		<h1>Server-Sent Events Demo</h1>
		<button id="connect">Connect to SSE</button>
		<button id="disconnect">Disconnect</button>
		<div id="events"></div>

		<script>
			let eventSource;
			const eventsDiv = document.getElementById("events");

			document.getElementById("connect").addEventListener("click", () => {
				if (eventSource) {
					logMessage("Already connected");
					return;
				}

				eventSource = new EventSource("http://localhost:3063/events");

				eventSource.onmessage = (e) => {
					const data = JSON.parse(e.data);
					logMessage(`Message: ${JSON.stringify(data)}`);
				};

				eventSource.onerror = (e) => {
					logMessage("Error occurred - connection lost");
					eventSource.close();
					eventSource = null;
				};

				logMessage("Connected to server");
			});

			document.getElementById("disconnect").addEventListener("click", () => {
				if (eventSource) {
					eventSource.close();
					eventSource = null;
					logMessage("Disconnected from server");
				} else {
					logMessage("Not currently connected");
				}
			});

			function logMessage(message) {
				const p = document.createElement("p");
				p.textContent = message;
				eventsDiv.appendChild(p);
				eventsDiv.scrollTop = eventsDiv.scrollHeight;
			}
		</script>
	</body>
</html>
